[package]
name = "klark-link"
version = "0.1.0"
edition = "2021"
description = "Outbound link from a klark machine to a klark hub: lazily streams panes on request"
license = "Apache-2.0"

[dependencies]
base64 = "0.22.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
