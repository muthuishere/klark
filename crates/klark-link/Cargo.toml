[package]
name = "klark-link"
version = "0.1.0"
edition = "2021"
description = "Outbound link from a klark machine to a klark hub: lazily streams panes on request"
license = "Apache-2.0"

[dependencies]
base64 = "0.22.1"
flate2 = "1"
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2"
# TLS for https:// and wss:// hubs (ADR 0005): the rustls stack tungstenite
# already pulls in, with ring (already in the tree via rustls-webpki).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
