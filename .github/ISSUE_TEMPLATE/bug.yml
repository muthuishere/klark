name: Bug report
description: Something in klark, klark expose or the hub does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Check [docs/STATUS.md](https://github.com/muthuishere/klark/blob/master/docs/STATUS.md) first: known gaps are listed there.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - klark (terminal / panes / agents)
        - klark expose (machine to hub)
        - hub (web UI / sign-in / storage)
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The shortest exact steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: klark version (`klark --version`), OS, terminal. For hub issues also the browser and `Hub:Auth:Mode`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The smallest useful excerpt.
      render: text
