# klarkhub: one replica only (SQLite + local asset store on the PVC). See docs/deploy.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: klarkhub-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klarkhub
  labels: { app: klarkhub }
spec:
  replicas: 1
  strategy:
    type: Recreate # never two pods on one SQLite file
  selector:
    matchLabels: { app: klarkhub }
  template:
    metadata:
      labels: { app: klarkhub }
    spec:
      securityContext:
        fsGroup: 65532 # the distroless nonroot user, so /data is writable
      containers:
        - name: klarkhub
          image: ghcr.io/muthuishere/klarkhub:latest
          ports:
            - containerPort: 7470
              name: http
          env:
            # - name: HUB_PUBLIC_URL # the address people open; used in klark hub connect links
            #   value: http://<node-ip>:30080
            - name: HUB_ADMIN_PASSWORD # used only on first start
              valueFrom:
                secretKeyRef: { name: klarkhub, key: admin-password, optional: true }
            - name: HUB_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: klarkhub, key: session-key, optional: true }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: # from the load test (docs/experiments/E-06)
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: klarkhub-data
---
apiVersion: v1
kind: Service
metadata:
  name: klarkhub
spec:
  type: NodePort # plain http on every node at :30080; use LoadBalancer if your cluster has one
  selector: { app: klarkhub }
  ports:
    - name: http
      port: 7470
      targetPort: http
      nodePort: 30080
