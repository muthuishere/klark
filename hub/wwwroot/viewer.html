<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>File · klark</title>
<script>try{var t=localStorage.getItem("klark:theme");document.documentElement.dataset.theme=t||"paper"}catch(e){}</script>
<link rel="stylesheet" href="/viewer.css" />
</head>
<body>
<header class="vbar">
  <a class="vback" href="/" id="back" aria-label="Back to chat">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Path"></nav>
</header>
<div class="vhead" id="head" hidden>
  <div class="meta" id="meta"></div>
  <div class="tabs" id="tabs"></div>
  <div class="acts">
    <input id="find" type="search" placeholder="Find in file" aria-label="Find in file" />
    <span id="findn" class="muted"></span>
    <label class="chk"><input type="checkbox" id="wrap" /> Wrap</label>
    <a class="btn" id="raw" target="_blank" rel="noopener">Raw</a>
    <button class="btn" id="copy" type="button">Copy</button>
    <a class="btn primary" id="dl">Download</a>
  </div>
</div>
<main id="body" class="vbody"><div class="loading">Loading…</div></main>
<script type="module" src="/viewer.js"></script>
</body>
</html>
