<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The Go server rewrites this to HUB_BASE_PATH ("/" or "/klark/"). Every URL in the app is relative to it. -->
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>klark</title>
  <script>try{var t=localStorage.getItem("klark:theme");document.documentElement.dataset.theme=t||"paper"}catch(e){document.documentElement.dataset.theme="paper"}</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
